# =============================================================================
# نام ورک‌فلو (در تب Actions گیت‌هاب نمایش داده می‌شود)
# =============================================================================
name: Moola Tasks Runner

on:
  # =========================================================================
  # تحریک دستی یا فراخوانی از بیرون توسط وب‌هوک سایت cron-job.org
  # =========================================================================
  workflow_dispatch:

# =============================================================================
# قفل هم‌زمانی: جلوگیری از اجرای تداخل‌دار (یکتا برای این ریپازیتوری/بات)
# =============================================================================
concurrency:
  group: moola-tasks-runner-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Moola bot tasks
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        # =====================================================================
        # اجرای اسکریپت جدید تسک‌های Moola
        # =====================================================================
        run: python Moola_bot_runner_tasks.py
